# Publishes a release when version.properties changes on main and its versionCode hasn't been
# released yet. Runs the CI checks first (ci.yml), then builds a signed bundle, uploads it to the
# internal testing track in Google Play as a draft and tags the commit as v<versionCode>. Promote
# the release in the Play Console.
name: Release

on:
  push:
    branches: [main]
    paths: [version.properties]

permissions:
  contents: read

# One release at a time: a second push waits, then finds its versionCode released or releases
# the next one, instead of racing the first to Play
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The tag check makes reruns and pushes with several commits safe: each versionCode is released
  # once, no matter how often the workflow runs. The other jobs are skipped when it was.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      released: ${{ steps.version.outputs.released }}
    steps:
      - uses: actions/checkout@v7

      - name: Check if this version was released
        id: version
        run: |
          code=$(grep '^versionCode=' version.properties | cut -d= -f2)
          echo "tag=v$code" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$code" > /dev/null; then
            echo "versionCode $code was already released, nothing to do"
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

  # The same checks as every push, so a broken main is never released
  check:
    needs: version
    if: needs.version.outputs.released != 'true'
    uses: ./.github/workflows/ci.yml

  release:
    needs: [version, check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Pushing the release tag
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Write signing config
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          cat > keystore.properties <<PROPS
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$UPLOAD_KEYSTORE_PASSWORD
          keyAlias=$UPLOAD_KEY_ALIAS
          keyPassword=$UPLOAD_KEY_PASSWORD
          PROPS

      - name: Build release bundle
        run: ./gradlew :app:bundleRelease

      - uses: actions/upload-artifact@v7
        with:
          name: app-release-${{ needs.version.outputs.tag }}
          path: app/build/outputs/bundle/release/app-release.aab

      # Pinned to a commit: it gets the Play service account's key, and a tag can be moved
      - uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: kiwi.lorenz.pdfreader
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft

      - name: Tag the release
        run: |
          git tag "${{ needs.version.outputs.tag }}"
          git push origin "${{ needs.version.outputs.tag }}"
