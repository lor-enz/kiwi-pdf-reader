# Runs the unit tests and lint and builds the release version (shrunk by R8, unsigned) on pushes
# to main and on pull requests. Lint fails the build on errors only; warnings are listed in the
# report. The reports are attached to the run when it fails.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # The Android version Robolectric simulates, downloaded on first use (~150 MB)
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml', 'app/src/test/resources/robolectric.properties') }}

      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug

      # R8 shrinks only the release version, and has broken it before (see CLAUDE.md)
      - name: Release build
        run: ./gradlew assembleRelease

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
